<!doctype html>
<html lang="zh-tw">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,user-scalable=0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title><%= title %></title>
    <meta property="og:description" content="<%= description %>" />
    <meta property="og:title" content="<%= title %>" />
    <meta property="og:image" content="<%= imageBase %>img/meta-img.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:url" content="<%= url %>" />
    <meta property="og:type" content="website" />
    <meta property="fb:app_id" content="<%= facebookID %>" />
    <meta property="og:site_name" content="<%= title %>" />
    <link rel="apple-touch-icon" href="<%= imageBase %>img/apple-touch-icon.jpg" />
    <link rel="image_src" href="<%= imageBase %>img/meta-img.jpg" />
    <link
      rel="icon"
      type="image/png"
      href="https://www.mcdonalds.com/content/dam/sites/tw/icons/fav.png"
    />
    <meta name="apple-mobile-web-app-capable" content="no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', '<%= googleAnalyticsID %>');
    </script>
    <!-- Meta Pixel Code -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = '2.0';
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '<%= facebookAnalyticsID %>');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
